# SonarQube Cloud project identity is passed by CI from repository variables.
# Keep this file free of credentials and organization-specific values so forks
# can configure their own SonarQube Cloud project.
sonar.sources=apps,libs
sonar.tests=apps,libs
sonar.test.inclusions=**/*.spec.ts,**/*.test.ts
sonar.exclusions=apps/app-e2e/**,**/*.spec.ts,**/*.test.ts
sonar.javascript.lcov.reportPaths=coverage/app/lcov.info,coverage/core-ddd/lcov.info,coverage/core-feature-flags/lcov.info,coverage/core-i18n/lcov.info
sonar.sourceEncoding=UTF-8
sonar.qualitygate.wait=true
